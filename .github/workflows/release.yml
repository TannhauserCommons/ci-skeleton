name: release

# The owner's command. Takes the newest green candidate from the standing
# release draft: no rebuild. A failure costs a rerun, never a burnt version,
# because the tag is created last.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fetch, sign and check, but publish nothing
        type: boolean
        default: false
      notes:
        description: A note to put at the top of the release text (optional)
        type: string
        default: ''

permissions:
  contents: read

# A release never cancels and never overlaps another.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Signing keys and deploy tokens live in this Environment, limited to main.
    environment: release
    permissions:
      contents: write
      issues: write
    # Shared with main's candidate job: see main.yml.
    concurrency:
      group: candidate
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      RELEASE_NOTES: ${{ inputs.notes }}
      # Checked first, dry run included: without the key the release would
      # publish and only then fail to move main on. A project whose version is
      # bumped elsewhere removes this line and the ci:bump step.
      BUMP_KEY_SET: ${{ secrets.BUMP_KEY != '' }}
    steps:
      # The release scripts run from main. The deploy key makes the bump push
      # count as a real push: it may pass a ruleset on main, and it starts the
      # next main run, which a push by the workflow token would not.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.BUMP_KEY }}
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
          cache_save: false
      # Puts the candidate's commit in candidate/ and its files in
      # candidate/dist, every hash checked.
      - id: candidate
        name: mise run ci:fetch
        run: mise run ci:fetch
      # `published` is true only on a rerun of a release that published and
      # then failed: the bump is all that is left.
      # The candidate's own tree signs its files, so the task matches them.
      - name: mise run publish
        if: ${{ steps.candidate.outputs.published != 'true' }}
        working-directory: candidate
        run: mise run publish
        # Only the candidate's own mise.toml: not main's, one folder up.
        env:
          MISE_CEILING_PATHS: ${{ github.workspace }}
      - name: mise run ci:publish
        if: ${{ steps.candidate.outputs.published != 'true' }}
        run: mise run ci:publish ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: mise run ci:bump
        run: mise run ci:bump --released ${{ steps.candidate.outputs.version }} ${{ inputs.dry_run && '--dry-run' || '' }}
        # PROJECT: who the "Start v<next>" commit is by.
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
