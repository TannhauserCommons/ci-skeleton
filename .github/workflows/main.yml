name: main

# Every push to main: everything check runs, on the merged result, then the
# release candidate. Blocks nothing; after.yml opens the issue when it is red.
# A release dispatches it for its bump commit, which a push by the workflow
# token does not start.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time. A newer pending run replaces an older pending one, so
# merges that land while main is busy are built and tested together.
concurrency:
  group: main
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml
    # A called workflow can use only what its caller grants: this is the most
    # any job in check.yml asks for.
    permissions:
      contents: read
      pull-requests: read
    with:
      all: true

  # PROJECT: one entry per release target. Unsigned; signing happens at release.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
      - name: mise run build
        run: mise run build
      - name: mise run smoke
        run: mise run smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # Time is a ratio against the last commit main tested, on one machine. It
  # never blocks a PR; past the noise floor it turns main red like any failure.
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
      - id: base
        name: mise run ci:base
        run: mise run ci:base
        env:
          GH_TOKEN: ${{ github.token }}
      - name: mise run compare
        run: mise run compare ${{ steps.base.outputs.base }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-notes
          path: dist/NOTES.md
          if-no-files-found: ignore
          retention-days: 1

  # Green marks the commit's files as the release candidate: they go on the
  # standing release draft, which nobody outside sees until it is published.
  candidate:
    needs: [check, build, compare] # PROJECT: every job above
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Shared with the release job, so a candidate is never replaced while a
    # release is signing and publishing it.
    concurrency:
      group: candidate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.10.23
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true
      - name: mise run ci:candidate
        run: mise run ci:candidate
        env:
          GH_TOKEN: ${{ github.token }}
